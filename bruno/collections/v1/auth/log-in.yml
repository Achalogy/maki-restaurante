info:
  name: Auth Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{host}}/api/v1/auth/log-in"
  body:
    type: json
    data: |+
      {
        "username": "acha@acha.dev",
        "password": "eveyzoe"
      }


  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Verificar que la respuesta fue exitosa (código 200 o 201)
        if (res.getStatus() === 200 || res.getStatus() === 201) {
          // Obtener el token del cuerpo de la respuesta
          // Ajusta 'res.getBody().token' según cómo devuelva el JSON tu API (ej. res.getBody().data.token)
          const token = res.getBody().token; 
          
          if (token) {
            // Guardar el token en una variable de entorno o de colección
            bru.setEnvVar("authToken", token);
            console.log("Token guardado exitosamente en 'authToken'");
          } else {
            console.error("No se encontró el token en la respuesta de la API");
          }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
