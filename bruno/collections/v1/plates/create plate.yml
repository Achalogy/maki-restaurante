info:
  name: create plate
  type: http
  seq: 3

http:
  method: POST
  url: "{{host}}/api/v1/plate?categoriaId=2"
  params:
    - name: categoriaId
      value: "2"
      type: query
  body:
    type: json
    data: |-
      {
        "nombre": "Sushi Maki Especial",
        "precio": 25.50,
        "descripcion": "Roll acevichado con topping de aguacate",
        "urlImage": "http://imagen.png",
        "disponibilidad": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
