
<div class="relative min-h-screen w-full">
  <ng-content></ng-content>

  <div *ngIf="(this.cart.state | async)" class="shopping-cart-button">
    <!-- ID AGREGADO: btn-cerrar-carrito -->
    <button id="btn-cerrar-carrito" (click)="this.cart.close()">
      <i class="ti ti-x text-3xl"></i>
    </button>

    <!-- ID AGREGADO: lista-carrito -->
    <div id="lista-carrito" class="flex flex-col gap-4 flex-1 w-full overflow-scroll">
      <!-- CLASE AGREGADA: carrito-item (dentro de ngFor → class) -->
      <div class="flex flex-col gap-2 border-b border-b-neutral-700 p-4 carrito-item"
           *ngFor="let item of shoppingCart">
        <div class="flex gap-4 items-center justify-center w-full">
          <img src={{item.plate.urlImage}} class="h-12 w-12 rounded-xl" alt="">
          <div class="flex flex-col flex-1 justify-center">
            <!-- CLASE AGREGADA: carrito-item-nombre -->
            <p class="font-semibold text-maki-orange carrito-item-nombre">{{item.plate.name}}</p>
            <label>Cantidad: 
              <input [(ngModel)]="item.quantity" class="text-black px-2 p-1 rounded-lg text-xs w-12"  type="number" min="1" id="">
            </label>
          </div>
          <!-- CLASE AGREGADA: carrito-item-precio -->
          <p class="carrito-item-precio">${{getItemPrice(item)}}</p>
          <i (click)="removeItem(item.plate)" class="ti ti-x text-red-500 cursor-pointer"></i>
        </div>
        <div class="flex flex-col gap-2 w-[90%] ml-auto">
          <!-- CLASE AGREGADA: carrito-item-adicional (dentro de ngFor → class) -->
          <div class="flex gap-2 items-center carrito-item-adicional" *ngFor="let additional of item.aditionals">
            <i class="ti ti-circle text-xs"></i>
            <!-- CLASE AGREGADA: carrito-adicional-nombre -->
            <p class="flex-1 carrito-adicional-nombre">{{additional.name}}</p>
            <p>${{additional.price}}</p>
          </div>
        </div>
      </div>
    </div>

    <div class="cart-price">
      <p>Tienes <b>{{shoppingCart.length}}</b> items en el carrito</p>
      <!-- ID AGREGADO: carrito-total -->
      <p id="carrito-total" class="text-xl">Total: <b>${{getPrice()}}</b></p>
    </div>

    <!-- ID AGREGADO: btn-pagar -->
    <button id="btn-pagar" (click)="createOrder()"
      class="pay-cart-btn flex gap-2 items-center justify-center text-xl transition hover:translate-x-1">
      <i class="ti ti-cash"></i>
      Ir a pagar
    </button>
  </div>
</div>
