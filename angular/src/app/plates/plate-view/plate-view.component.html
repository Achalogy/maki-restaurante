<app-header-menu>
  
</app-header-menu>

<main id="single-item" *ngIf="plate; else notFound">
  <div class="single-food-card">
    <div id="plate-img">
      <img [src]="plate.urlImage" [alt]="plate.name" />
    </div>

    <div id="plate-info">
      <h2 class="mb-0">{{ plate.name }}</h2>
      <h3 class="font-semibold mt-0 text-sm text-orange-600">
        {{ plate.category.name }}
      </h3>

      <p class="mt-4">{{ plate.description }}</p>

      <div id="special-info">
        <form>
          <label for="special-instructions">Instrucciones especiales:</label>
          <textarea id="special-instructions" name="specialInstructions" [(ngModel)]="specialInstructions" rows="4"
            cols="50" class="w-full border rounded p-2">
          </textarea>
        </form>
      </div>

      <div id="adicionales">
        <h4 class="text-lg font-semibold mb-2">Adicionales disponibles:</h4>

        <form (ngSubmit)="addToOrder()">
          <div class="flex items-center mb-2" *ngIf="plate.category.id === 1">
            <input type="checkbox" id="extra" class="mr-2">
            <label for="extra" class="text-sm">Porción extra de salsa</label>
          </div>

          <button type="submit" class="mt-4 bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 px-4 rounded">
            Agregar al pedido
          </button>
        </form>

        <p *ngIf="!plate.available" class="text-red-500 text-sm mt-2">
          Lo sentimos, este plato no está disponible actualmente.
        </p>
      </div>
    </div>
  </div>
</main>

<ng-template #notFound>
  <div class="text-center py-20">
    <h2 class="text-2xl font-bold">Plato no encontrado</h2>
    <p>El plato que buscas no existe en nuestro menú.</p>
  </div>
</ng-template>

<app-footer></app-footer>
