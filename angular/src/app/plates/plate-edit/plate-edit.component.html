<app-header-menu>

</app-header-menu>


<main class="tree_background">
  <h2 class="text-center">MENÚ de Administrador</h2>
  <section class="max-w-full mx-auto px-6 py-10" *ngIf="plate">
    <div class="bg-white shadow-xl rounded-2xl p-10 w-full max-w-3xl mx-auto">
      <h3 class="text-2xl font-bold mb-8 text-gray-800 text-center">Editar Plato</h3>

      <form class="space-y-6" (ngSubmit)="updatePlate()">
        <input type="hidden" name="id" [(ngModel)]="plate.id" />

        <div>
          <label class="block font-semibold text-gray-700 mb-2">Nombre del plato</label>
          <input type="text" name="name" [(ngModel)]="plate.name" required
            class="w-full border border-gray-300 rounded-lg px-4 py-3" />
        </div>

        <div>
          <label class="block font-semibold text-gray-700 mb-2">Descripción</label>
          <textarea name="description" rows="4" [(ngModel)]="plate.description" required
            class="w-full border border-gray-300 rounded-lg px-4 py-3 resize-none"></textarea>
        </div>

        <div class="grid md:grid-cols-2 gap-6">
          <div>
            <label class="block font-semibold text-gray-700 mb-2">Precio</label>
            <input type="number" name="price" [(ngModel)]="plate.price" step="0.01" required
              class="w-full border border-gray-300 rounded-lg px-4 py-3" />
          </div>
          <div>
            <label class="block font-semibold text-gray-700 mb-2">Imagen (URL)</label>
            <input type="text" name="urlImage" [(ngModel)]="plate.urlImage" required
              class="w-full border border-gray-300 rounded-lg px-4 py-3" />
          </div>
        </div>

        <div>
          <label class="block font-semibold text-gray-700 mb-2">Categoría</label>
          <select name="categoryId" [(ngModel)]="plate.category.id" required
            class="w-full border border-gray-300 rounded-lg px-4 py-3">
            <option *ngFor="let category of categoryList" [value]="category.id">{{category.name}}</option>
          </select>
        </div>

        <div class="flex items-center gap-3">
          <input type="checkbox" name="available" [(ngModel)]="plate.available" class="w-5 h-5 accent-orange-500" />
          <label class="font-semibold text-gray-700">Disponible para venta</label>
        </div>

        <button type="submit"
          class="w-full bg-[#eb7c21] hover:bg-[#d15d19] text-white font-bold py-4 rounded-xl text-lg">
          Actualizar Cambios
        </button>
      </form>
    </div>
  </section>
</main>

<app-footer>
  
</app-footer>
