<app-full-layout>
  <main class="tree_background">
    <br />
    <h2 class="text-center">MENÚ de Administrador</h2>
    <section class="max-w-full mx-auto px-6 py-10">
      <div class="bg-white shadow-xl rounded-2xl p-10 w-full max-w-3xl mx-auto">
        <h3 class="text-2xl font-bold mb-8 text-gray-800 text-center">Crear Nuevo Adicional</h3>
  
        <form class="space-y-6" (ngSubmit)="saveAdditional()">
  
          <div>
            <label class="block font-semibold text-gray-700 mb-2">Nombre del adicional</label>
            <input id="name" type="text" name="name" [(ngModel)]="additional.name" required placeholder="Ej: Extra Queso"
              class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-[#eb7c21] focus:border-[#eb7c21]" />
          </div>
  
          <div class="grid md:grid-cols-2 gap-6">
            <div>
              <label class="block font-semibold text-gray-700 mb-2">Precio</label>
              <input id="price" type="number" name="price" [(ngModel)]="additional.price" step="0.01" required
                class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-[#eb7c21] focus:border-[#eb7c21]" />
            </div>
          </div>
  
          <div>
            <label class="block font-semibold text-gray-700 mb-2">Asignar a Categorías</label>
            <select id="categories" multiple name="categories" [(ngModel)]="selectedCategoryList" [compareWith]="compareCategory" required
              class="w-full border border-gray-300 rounded-lg px-4 py-3 min-h-[120px] focus:ring-[#eb7c21] focus:border-[#eb7c21]">
              <option *ngFor="let category of categoryList" [ngValue]="category" class="py-1">
                {{category.name}}
              </option>
            </select>
            <p class="text-sm text-gray-500 mt-2">
              * Mantén presionado <kbd class="bg-gray-100 border rounded px-1 font-sans">Ctrl</kbd> para seleccionar
              varias.
            </p>
          </div>
  
          <div class="flex gap-4">
            <button id="cancelButton" type="button" (click)="router.navigate(['/ruta-anterior'])"
              class="w-1/3 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-4 rounded-xl text-lg transition">
              Cancelar
            </button>
            <button id="saveButton" type="submit"
              class="w-2/3 bg-[#eb7c21] hover:bg-[#d15d19] text-white font-bold py-4 rounded-xl text-lg shadow-lg transition">
              Guardar Adicional
            </button>
          </div>
        </form>
      </div>
    </section>
  </main>
</app-full-layout>
