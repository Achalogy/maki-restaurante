<a
  (click)="navigate()"
  class="group block bg-white border rounded-xl p-5 hover:border-gray-300 hover:scale-105 transition-all cursor-pointer"
>
  <div class="w-9 h-9 rounded-lg bg-orange-400 flex items-center justify-center mb-3">
    <i class="{{data?.icon}} text-white"></i>
  </div>
  <p class="text-sm font-medium text-gray-900">{{data?.title}}</p>
  <p class="text-xs text-gray-400 mt-0.5">{{data?.description}}</p>
</a>
