<app-full-layout>
  <div class="h-screen flex flex-col items-center justify-center bg-gray-100">
  
    <div class="bg-white p-8 w-full md:w-2/3">
      <h3 class="text-2xl font-staatliches">ID del Operador: {{ operator?.id }}</h3>
      <p class="text-gray-600">Nombre: {{ operator?.name }}</p>
      <p class="text-gray-600">Usuario: {{ operator?.username }}</p>
  
      <div class="mt-8 flex gap-2">
        <button (click)="editOperator()"
          class="bg-maki-orange transition hover:-translate-y-1 text-white font-bold py-2 px-4 rounded">
          Editar
        </button>
        <button (click)="backToCrud()"
          class="bg-gray-500 transition hover:-translate-y-1 text-white font-bold py-2 px-4 rounded">
          Volver
        </button>
      </div>
    </div>
  </div>
</app-full-layout>
