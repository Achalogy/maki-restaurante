<app-full-layout>
  <main class="tree_background min-h-[80dvh] flex items-center justify-center py-8">
  
    <section class="flex flex-col gap-8 w-[95%] xl:max-w-[60rem] bg-white shadow-2xl rounded-2xl p-12">
  
      <!-- Bienvenida -->
      <div class="text-center mb-10">
        <h2 class="text-[6rem]! font-bold mb-4">
          Bienvenido a <span class="text-maki-orange text-[6rem]!">MAKI</span>
        </h2>
        <p class="text-xl text-gray-600">
          Sesión activa como:
        </p>
        <p class="text-2xl font-semibold mt-2">
          {{client?.email}}
        </p>
      </div>
  
      <!-- Panel de acciones -->
      <div class="grid md:grid-cols-2 gap-8 mt-8">
  
        <a [routerLink]="['/plate/menu']"
          class="bg-maki-orange text-white p-8 rounded-xl shadow-lg hover:scale-105 transition duration-200 text-center">
          <h3 class="text-2xl font-bold mb-2">Ver Menú</h3>
          <p>Explora nuestros platos disponibles</p>
        </a>
  
        <a [routerLink]="['/client/profile', client?.id]"
          class="bg-maki-black p-8 rounded-xl shadow-lg hover:scale-105 transition duration-200 text-center">
          <h3 class="text-2xl font-bold mb-2 !text-maki-orange">Mi Perfil</h3>
          <p class="!text-white">Gestiona tu información personal</p>
        </a>
  
      </div>
  
      <button (click)="logOut()" class="text-maki-orange bg-maki-black rounded-xl mx-auto p-4 px-8 font-semibold">Cerrar
        sesión</button>
  
    </section>
  
  </main>
</app-full-layout>
