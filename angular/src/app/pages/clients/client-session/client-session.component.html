<app-full-layout>
  <main class="tree_background min-h-[80dvh] flex items-center justify-center py-8">

    <section class="flex flex-col gap-8 w-[95%] xl:max-w-[60rem] bg-white shadow-2xl rounded-2xl p-12">

      <!-- Bienvenida -->
      <div class="text-center mb-10">
        <h2 class="text-[6rem]! font-bold mb-4">
          Bienvenido a <span class="text-maki-orange text-[6rem]!">MAKI</span>
        </h2>
        <p class="text-xl text-gray-600">
          Sesión activa como:
        </p>
        <p class="text-2xl font-semibold mt-2">
          {{client?.email}}
        </p>
      </div>

      <!-- Panel de acciones -->
      <div class="grid md:grid-cols-2 gap-8 mt-8">

        <a [routerLink]="['/plate/menu']"
          class="group bg-maki-black text-white p-8 rounded-xl shadow-lg hover:bg-maki-orange hover:scale-105 transition duration-200 text-center">
          <h3 class="text-2xl font-bold mb-2 text-maki-orange group-hover:text-maki-black">Ver Menú</h3>
          <p class="group-hover:text-maki-black">Explora nuestros platos disponibles</p>
        </a>

        <a [routerLink]="['/client/profile']"
          class="group bg-maki-black text-white p-8 rounded-xl shadow-lg hover:bg-maki-orange hover:scale-105 transition duration-200 text-center">
          <h3 class="text-2xl font-bold mb-2 text-maki-orange group-hover:text-maki-black">Mi Perfil</h3>
          <p class="group-hover:text-maki-black">Gestiona tu información personal</p>
        </a>

        <a [routerLink]="['/client/orders', client?.id]"
          class="group bg-maki-black text-white p-8 rounded-xl shadow-lg hover:bg-maki-orange hover:scale-105 transition duration-200 text-center md:col-span-2 md:w-1/2 md:mx-auto">
          <h3 class="text-2xl font-bold mb-2 text-maki-orange group-hover:text-maki-black">Mis Pedidos</h3>
          <p class="group-hover:text-maki-black">Ver el historial de tus pedidos</p>
        </a>

      </div>

      <button (click)="logOut()" class="text-maki-orange bg-maki-black rounded-xl mx-auto p-4 px-8 font-semibold hover:scale-105 transition duration-200">Cerrar
        sesión</button>

    </section>

  </main>
</app-full-layout>
